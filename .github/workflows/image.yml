name: image

on:
  push:
    tags: ['v*']
  # So an image can be built for a tag that already exists, or to test a change
  # to this workflow without cutting a release.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build'
        required: false
        default: 'main'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # arm64 as well as amd64: a good share of the people who would reach for
      # this are on Apple Silicon, and emulating the wrong architecture at
      # runtime is a slow, confusing first impression.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=escpos-emu
            org.opencontainers.image.description=Emulate ESC/POS thermal printers on real IP addresses.
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
